# Keyless generic ACP v1 control-surface patch over `monolith --profile acp`.

- id: llm-deepseek
  name: '@monolith/llm-deepseek'
  disabled: true

- id: acp
  name: '@monolith/acp'
  config:
    provider: control-fixture
    model: alpha

- id: session-persistence-jsonl
  name: '@monolith/session-persistence-jsonl'
  config:
    root: !!js process.env.MONOLITH_CONFORMANCE_PERSISTENCE_ROOT
    compression: none

- insert:
    - id: control-surface-llm
      name: './control-surface-llm.ts'

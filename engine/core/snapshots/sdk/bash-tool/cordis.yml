# SDK snapshot-record composition without provider-specific upload metadata.

- id: skill-filesystem
  name: '@monolith/skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@monolith/llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@monolith/session-persistence-jsonl'
  config:
    root: !!js monolithHomePath('sessions')
    compression: !!js "process.env.MONOLITH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@monolith/tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

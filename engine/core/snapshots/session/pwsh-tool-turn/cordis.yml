# Minimal live counterpart for the pwsh-tool-turn snapshot composition.
- id: llm-deepseek
  name: '@monolith/llm-deepseek'
  config:
    models:
      - id: deepseek-v4-pro

- id: subprocess
  name: '@monolith/subprocess-local'

- id: bash-sandbox
  name: '@monolith/bash-sandbox'
  disabled: true

- id: pwsh-sandbox
  name: '@monolith/pwsh-sandbox'
  disabled: false

- id: shell-env
  name: '@monolith/shell-env'

- id: agent-default-model
  name: '@monolith/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@monolith/session-persistence-jsonl'
  config:
    root: !!js monolithHomePath('sessions')
    compression: !!js 'process.env.MONOLITH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@monolith/agent-instructions'
  disabled: true

- id: system-prompt
  name: '@monolith/system-prompt'
  config:
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: goal
  name: '@monolith/goal'
  disabled: true

- id: goal-round-driver
  name: '@monolith/goal-round-driver'
  disabled: true

- id: command-goal
  name: '@monolith/command-goal'
  disabled: true

- id: tool-goal
  name: '@monolith/tool-goal'
  disabled: true

- id: skill
  name: '@monolith/skill'
  disabled: true

- id: skill-filesystem
  name: '@monolith/skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@monolith/tool-skill'
  disabled: true

- id: tool-bash
  name: '@monolith/tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@monolith/tool-pwsh'
  disabled: false

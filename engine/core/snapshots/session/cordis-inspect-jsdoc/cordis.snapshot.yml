# Replay counterpart to advanced.cordis.yml; only the live model is replaced.
- id: llm-deepseek
  name: '@monolith/llm-deepseek'
  disabled: true

- id: agent-default-model
  name: '@monolith/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@monolith/session-persistence-jsonl'
  config:
    root: !!js monolithHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@monolith/agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@monolith/tools'
  config:
    mode: both

- id: system-prompt
  name: '@monolith/system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: cordis-host-runner
      name: '@monolith/cordis-host-runner'
    - id: tool-cordis
      name: '@monolith/tool-cordis'
    - id: llm-replay
      name: '@monolith/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

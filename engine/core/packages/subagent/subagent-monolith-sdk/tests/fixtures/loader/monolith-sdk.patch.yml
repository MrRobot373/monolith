# Test-only SDK provider patch over the shipped headless profile. The child
# is a complete sdk profile; the parent omits `cwd` to exercise inheritance.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: mock
        model: mock-delegate
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- id: tool-subagent
  disabled: true

- insert:
    - id: mock-llm
      name: './mock-delegating-llm.ts'

    - id: subagent-model-selection-settings
      name: '@monolith/tool-subagent/model-selection-settings'
      config:
        enabled: true
        allowedModels:
          - provider: mock
            model: mock-routed

    - id: test-tool-subagent
      name: './scoped-tool-subagent.ts'
      config:
        provider: monolith-sdk
        toolName: subagent
        agentOptions:
          maxTokens: 777
        maxDepth: 'provider-managed'

    # providerName is omitted to exercise the shipped `monolith-sdk` default.
    - id: subagent-monolith-sdk
      name: '@monolith/subagent-monolith-sdk'
      config:
        profile: sdk
        patches: !!js JSON.parse(process.env.MONOLITH_TEST_CHILD_PATCHES ?? '[]')
        monolithHome: !!js process.env.MONOLITH_TEST_CHILD_HOME
        provider: mock
        model: mock-routed
        env:
          MONOLITH_TELEMETRY_DISABLED: '1'
          MONOLITH_TEST_CHILD_FAILURE: !!js String(process.env.MONOLITH_TEST_CHILD_FAILURE ?? '')

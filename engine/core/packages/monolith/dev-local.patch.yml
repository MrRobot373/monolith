# DEV-ONLY overlay: run MONOLITH against a local Ollama instead of the LiteLLM
# gateway, for working on the machine with no stack up.
#
#   monolith --profile monolith --patch packages/monolith/dev-local.patch.yml
#
# Applied AFTER the MONOLITH bundle layer, so it replaces that layer's whole
# llm-pi-ai config. Never ship this: it has no gateway, so no budget, no spend
# accounting, and no per-user key.
- id: llm-pi-ai
  config:
    providers:
      monolith:
        displayName: MONOLITH (local Ollama)
        api: openai-completions
        baseURL: !!js process.env.MONOLITH_GATEWAY_URL ?? 'http://127.0.0.1:11434/v1'
        # pi-ai requires a credential reference even for an endpoint that needs
        # none — a keyless route fails the turn with "No API key for provider"
        # (PI_AI_ERROR), verified live. Ollama ignores the value.
        apiKeyEnv: OLLAMA_API_KEY
        models:
          - id: qwen3.5:9b
            name: Qwen 3.5 9B (local)
            contextWindow: 32768
            maxTokens: 8192
          - id: gemma4:e4b
            name: Gemma 4 (local)
            contextWindow: 32768
            maxTokens: 8192
          - id: qwen3-vl:2b-instruct
            name: Qwen 3 VL 2B (local, fast)
            contextWindow: 32768
            maxTokens: 4096

# The product overlay defaults to the gateway's `claude` alias, which no local
# Ollama serves; point new sessions at a model that is actually present.
- id: agent-default-model
  config:
    provider: monolith
    model: qwen3.5:9b

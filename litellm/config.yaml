litellm_settings:
  drop_params: true      # tolerate provider-specific param differences
  num_retries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # DATABASE_URL (Postgres) enables per-user virtual keys + spend tracking (Phase 2).

router_settings:
  # Load-balance across the many "ollama-pool" deployments (your round-robin keys).
  routing_strategy: simple-shuffle
  num_retries: 3
  allowed_fails: 2          # after 2 failures a key is briefly cooled down
  cooldown_time: 60
  fallbacks:
    - claude: ["gemini", "local-qwen"]
    - gpt: ["gemini", "local-qwen"]
    - gemini: ["local-qwen"]

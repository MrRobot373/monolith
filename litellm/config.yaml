# MONOLITH hybrid model gateway.
# Exposes ONE OpenAI-compatible endpoint (http://litellm:4000/v1) that every
# OpenWork workspace calls. Pick cloud vs local per task by choosing the model
# alias in the OpenWork UI. Adjust ids / add providers freely.

model_list:
  # -- Cloud: highest quality (this is the "literally Claude" tier) -----------
  - model_name: claude
    litellm_params:
      model: anthropic/claude-sonnet-5      # adjust to your chosen Claude model
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gpt
    litellm_params:
      model: openai/gpt-4o                  # adjust to your preferred OpenAI model
      api_key: os.environ/OPENAI_API_KEY

  # -- Gemini (Google AI Studio) — real free tier; use ONE legit key -----------
  - model_name: gemini
    litellm_params:
      model: gemini/gemini-2.0-flash        # capable + fast; adjust to a current Gemini model
      api_key: os.environ/GEMINI_API_KEY

  # -- Local: private / cheap / offline (needs ollama + a pulled model) -------
  #    Pull once:  docker compose exec ollama ollama pull qwen2.5:0.5b
  #    (0.5b = fast smoke-test model; swap to qwen2.5 (7b) or larger for real use)
  - model_name: local-qwen
    litellm_params:
      model: ollama/qwen2.5:0.5b
      api_base: http://ollama:11434


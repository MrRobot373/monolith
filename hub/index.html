<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MONOLITH</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#111417; --panel2:#15191d; --line:#232a31;
    --text:#e8edf2; --muted:#93a1ad; --accent:#4c9be8; --accent2:#8b7bf0;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 70% -10%, #17202a 0%, var(--bg) 55%);
    color:var(--text); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    display:flex; min-height:100%;
  }
  a{color:inherit;text-decoration:none}

  /* Sidebar */
  .side{width:240px;flex:0 0 240px;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;background:rgba(10,12,15,.6)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px;padding:6px 8px 16px}
  .brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--muted);font-weight:500}
  .nav a:hover{background:var(--panel);color:var(--text)}
  .nav .label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#5c6874;padding:16px 10px 6px}
  .side .foot{margin-top:auto;font-size:12px;color:#5c6874;padding:10px}

  /* Main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;padding:64px 28px 48px}
  .hero{width:100%;max-width:820px;text-align:center;margin-bottom:26px}
  .hero h1{font-size:30px;margin:0 0 8px;font-weight:650}
  .hero p{color:var(--muted);margin:0}
  .searchwrap{width:100%;max-width:720px;margin:22px auto 40px}
  .search{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:14px 18px;transition:border-color .15s,box-shadow .15s}
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(76,155,232,.12)}
  .search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:16px}
  .search input::placeholder{color:#66727d}
  .search button{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:17px;display:grid;place-items:center}

  .grid{width:100%;max-width:920px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:transform .12s,border-color .15s,background .15s}
  .card:hover{transform:translateY(-2px);border-color:#33414d;background:var(--panel2)}
  .card .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(76,155,232,.18),rgba(139,123,240,.18));color:var(--accent);margin-bottom:12px}
  .card h3{margin:0 0 5px;font-size:16px;font-weight:600}
  .card p{margin:0;color:var(--muted);font-size:13.5px}
  .sectlabel{width:100%;max-width:920px;color:#5c6874;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:6px 2px 12px}
  @media(max-width:720px){.side{display:none}.main{padding:36px 16px}}
</style>
</head>
<body>
  <aside class="side">
    <div class="brand"><span class="dot"></span><span id="brand">MONOLITH</span></div>
    <nav class="nav">
      <a href="#" class="active">🏠 <span>Home</span></a>
      <div class="label">Modes</div>
      <div id="sideModes"></div>
    </nav>
    <div class="foot">One login · your AI workspace</div>
  </aside>

  <main class="main">
    <div class="hero">
      <h1 id="hi">What do you want to do?</h1>
      <p>Search for answers, or pick a mode to put an AI expert to work.</p>
    </div>
    <form class="searchwrap" id="searchForm">
      <div class="search">
        <span style="color:#66727d">🔎</span>
        <input id="q" placeholder="Ask anything — get a cited answer…" autocomplete="off" />
        <button type="submit" title="Search">→</button>
      </div>
    </form>
    <div class="sectlabel">Choose a mode</div>
    <section class="grid" id="grid"></section>
  </main>

<script>
(async function(){
  let cfg;
  try { cfg = await (await fetch('modes.json',{cache:'no-store'})).json(); }
  catch(e){ document.getElementById('grid').textContent = 'Could not load modes.json'; return; }

  document.getElementById('brand').textContent = cfg.product || 'MONOLITH';
  document.title = cfg.product || 'MONOLITH';

  const icons = {
    "Research":"📖","Code":"💻","Cowork":"🧩","Agent":"⚡"
  };
  const target = m =>
    cfg.openworkBase + (m.agent ? '/?agent=' + encodeURIComponent(m.agent) : '/');

  // Search bar -> the research agent, with the question prefilled in the composer.
  document.getElementById('searchForm').addEventListener('submit', e => {
    e.preventDefault();
    const q = document.getElementById('q').value.trim();
    window.location.href =
      cfg.openworkBase + '/?agent=research' + (q ? '&q=' + encodeURIComponent(q) : '');
  });

  // Cards
  const grid = document.getElementById('grid');
  const sideModes = document.getElementById('sideModes');
  cfg.modes.forEach(m => {
    const a = document.createElement('a');
    a.className = 'card'; a.href = target(m);
    a.innerHTML = `<div class="ic">${icons[m.name]||'✦'}</div><h3>${m.name}</h3><p>${m.desc}</p>`;
    grid.appendChild(a);

    const s = document.createElement('a');
    s.href = target(m);
    s.innerHTML = `${icons[m.name]||'✦'} <span>${m.name}</span>`;
    sideModes.appendChild(s);
  });
})();
</script>
</body>
</html>

# MONOLITH — Phase 1 core stack (single shared workspace).
# Built on OpenWork's MIT-licensed orchestrator (UI served at :8787/ui) + a LiteLLM
# hybrid model gateway (cloud + local Ollama). Multi-user auth (Authelia) and the
# agent tools (Agent-Reach, open-claude-code, Perplexica) arrive in Phases 2-3.
#
# Bring up:   docker compose up -d --build
# Then open:  http://localhost   (Caddy -> engine:8787/ui)

name: monolith

services:
  # ---- Reverse proxy (TLS in prod, plain http on :80 for local) -------------
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3001:3001"   # Perplexica/Vane cited-search site (behind login)
    environment:
      # Local default = ":80" (plain http). For a real server set
      # MONOLITH_SITE_ADDRESS=work.yourco.com and Caddy auto-provisions HTTPS.
      MONOLITH_SITE_ADDRESS: ${MONOLITH_SITE_ADDRESS:-:80}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/users:/etc/caddy/users:ro
      - ./hub:/srv/hub:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - webui
      - vane

  # ---- Perplexica / Vane — cited AI web search (self-contained, bundles SearxNG)
  vane:
    image: itzcrazykns1337/vane:latest
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - node /monolith/seed-config.mjs && exec docker-entrypoint.sh /home/vane/entrypoint.sh
    environment:
      MONOLITH_GATEWAY_URL: http://litellm:4000/v1
      MONOLITH_GATEWAY_KEY: ${LITELLM_MASTER_KEY}
      MONOLITH_VANE_CHAT_MODEL: local-qwen
    volumes:
      - vane_data:/home/vane/data
      - ./vane/seed-config.mjs:/monolith/seed-config.mjs:ro
    expose:
      - "3000"
    depends_on:
      - litellm

  # ---- Full OpenWork web UI (built from source, replaces the Toy UI) ---------
  webui:
    build:
      context: .
      dockerfile: webui/Dockerfile
      args:
        # Browser-reachable engine API + tokens, baked into the SPA at build time.
        VITE_MONOLITH_URL: ${WEBUI_MONOLITH_URL:-http://localhost}
        VITE_MONOLITH_TOKEN: ${MONOLITH_TOKEN}
        VITE_MONOLITH_HOST_TOKEN: ${MONOLITH_HOST_TOKEN}
        MONOLITH_PRODUCT_NAME: ${MONOLITH_PRODUCT_NAME:-MONOLITH}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - engine

  # ---- MONOLITH engine (MIT core: our orchestrator + vendored opencode) ------
  # One container == one working MONOLITH workspace at :8787/ui.
  # Phase 2 replaces this single service with one container per user.
  engine:
    build:
      context: .
      dockerfile: workspace-image/Dockerfile
    restart: unless-stopped
    environment:
      # own (default) = our orchestrator on vendored opencode, no external
      # binary. legacy = the old openwork-orchestrator prebuilt binary,
      # kept one release as a rollback path.
      MONOLITH_ENGINE: ${MONOLITH_ENGINE:-own}
      MONOLITH_ENGINE_DATA_DIR: /data/orchestrator
      MONOLITH_SIDECAR_DIR: /data/sidecars
      MONOLITH_WORKSPACE: /workspace
      MONOLITH_TOKEN: ${MONOLITH_TOKEN}
      MONOLITH_HOST_TOKEN: ${MONOLITH_HOST_TOKEN}
      MONOLITH_APPROVAL_MODE: ${MONOLITH_APPROVAL_MODE:-manual}
      # Model gateway wiring (consumed by the entrypoint's opencode provider seed).
      MONOLITH_GATEWAY_URL: http://litellm:4000/v1
      MONOLITH_GATEWAY_KEY: ${MONOLITH_LITELLM_KEY:-${LITELLM_MASTER_KEY}}
      # Read-only view of the sidecar's per-user MCP catalog store (see
      # monolith_sidecar mount below) so seed-models.mjs can mirror enabled
      # catalog servers into this workspace's opencode.json on boot.
      MONOLITH_SIDECAR_DATA_DIR: /sidecar-data
    volumes:
      - monolith_workspace:/workspace
      - monolith_data:/data
      - monolith_sidecar:/sidecar-data:ro
    # Not published to the host: the browser reaches the API only through Caddy
    # (same-origin, behind the login). Internal-only.
    expose:
      - "8787"
    depends_on:
      - litellm
      - searxng

  # ---- MONOLITH sidecar (scheduled tasks + dispatch threads) ----------------
  # Plain Node, no build: the source dir is mounted read-only. Caddy routes
  # work.<domain>/__monolith/* here (behind the site login).
  monolith-server:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/app/server.mjs"]
    environment:
      MONOLITH_ENGINE_URL: http://engine:8787
      MONOLITH_TOKEN: ${MONOLITH_TOKEN}
      MONOLITH_HOST_TOKEN: ${MONOLITH_HOST_TOKEN}
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATA_DIR: /data
      # Reach the compose ollama service (chat.mjs defaults to localhost, which
      # is unreachable from this container). Required for the router's small tier.
      OLLAMA_URL: http://ollama:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      # ---- Smart model router (cost-saving auto-routing) ----
      MONOLITH_ROUTER_ENABLED: ${MONOLITH_ROUTER_ENABLED:-1}
      MONOLITH_ROUTER_SMALL_MODEL: ${MONOLITH_ROUTER_SMALL_MODEL:-qwen2.5:0.5b}
      # Blank large model auto-resolves to the LiteLLM gateway ('claude' alias)
      # since LITELLM_URL is set above. Override to pin a different tier.
      MONOLITH_ROUTER_LARGE_PROVIDER: ${MONOLITH_ROUTER_LARGE_PROVIDER:-litellm}
      MONOLITH_ROUTER_LARGE_MODEL: ${MONOLITH_ROUTER_LARGE_MODEL:-claude}
    volumes:
      - ./monolith-server:/app:ro
      - monolith_sidecar:/data
    expose:
      - "8790"
    depends_on:
      - engine

  # ---- SearXNG — privacy-respecting search engine for agents ----------------
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    expose:
      - "8080"

  # ---- Hybrid model gateway --------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # Loads all .env vars (incl. the OLLAMA_KEY_* round-robin pool) into the gateway.
    env_file:
      - .env
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}   # NEVER change after first boot (encrypts stored keys)
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    expose:
      - "4000"
    depends_on:
      litellm-db:
        condition: service_healthy

  litellm-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - litellm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- Local models (optional; cloud handles quality in hybrid mode) ---------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    # For an NVIDIA GPU host, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  caddy_data:
  caddy_config:
  monolith_workspace:
  monolith_data:
  litellm_pg:
  ollama_models:
  vane_data:
  monolith_sidecar:
